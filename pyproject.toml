[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheep-vision-solver"
version = "0.1.0"
description = "Windows screenshot based SheepVisionSolver prototype with classic tile recognition"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = ["Pillow>=10", "opencv-python>=4.8", "numpy>=1.26", "pynput>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

